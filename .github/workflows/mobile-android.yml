# 운영 Android 앱 "파봄"(app.pabom.mobile)을 EAS에서 AAB로 빌드·서명하고, 원하면 Google Play 내부 테스트 트랙에 올린다
# (eas.json production 프로필). 서명 키스토어와 Play 제출용 Google 서비스 계정 키는 EAS 서버에 있고(eas credentials),
# 여기서는 EXPO_TOKEN만 쓴다. 제출은 초안(draft)으로 올라가니 Play Console 에서 검토 후 출시한다.
# 운영 배포는 항상 main 기준이다. 개발 앱 "파봄(dev)"은 mobile-android-dev.yml 이 develop 에서 자동으로 빌드한다.
# - 수동 실행: Actions → "Mobile Android" → Run workflow 에서 제출 여부를 고른다.
#   어떤 브랜치를 골라도 main 최신 커밋을 빌드한다
# - 태그: mobile-v* 태그를 올리면 iOS(mobile-ios.yml)와 함께 production 빌드만 한다.
#   Play 제출은 Play Console 에 앱을 만들고 첫 AAB 를 손으로 올린 뒤(Google API 제약), 수동 실행으로 한다.
#   태그가 main에 들어간 커밋을 가리키지 않으면 빌드하지 않고 실패한다
name: Mobile Android

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "빌드가 끝나면 Google Play 내부 테스트 트랙에 초안으로 제출"
        type: boolean
        default: false
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS Android build (production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      PROFILE: production
      SUBMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.submit }}
    steps:
      # 수동 실행은 고른 브랜치와 상관없이 main을, 태그는 그 태그 커밋을 받는다
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Ensure the commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) 는 main에 없는 커밋이다. main에 머지한 뒤 main 커밋에 태그를 붙인다"
            exit 1
          fi
          echo "Building $(git rev-parse --short HEAD) from main"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build (and submit)
        run: |
          args=(--platform android --profile "$PROFILE" --non-interactive --no-wait)
          if [ "$SUBMIT" = "true" ]; then
            args+=(--auto-submit-with-profile "$PROFILE")
          fi
          eas build "${args[@]}"
