# 개발 서버용 앱 "파봄(dev)"(app.pabom.mobile.dev)을 iOS·Android 함께 EAS에서 빌드한다 (eas.json preview 프로필).
# - iOS: 빌드가 끝나면 TestFlight "파봄(dev)"으로 제출한다
# - Android: Play 스토어를 거치지 않는 내부 배포 APK. expo.dev 빌드 페이지의 설치 링크·QR을 테스터에게 보낸다
# 운영 앱 "파봄"은 mobile.yml 에서 main 기준으로만 배포한다.
# - 수동으로만 돈다: Actions → "Mobile (dev)" → Run workflow. 어떤 브랜치를 골라도 develop 최신 커밋을 빌드한다
#   (머지마다 자동으로 빌드하면 EAS 빌드 횟수·크레딧이 빨리 닳아서 자동 빌드는 껐다)
# 서명 키(iOS 인증서, Android 키스토어)는 EAS 서버에 있다. CI(--non-interactive)는 새로 만들 수 없어서,
# 새 앱은 처음 한 번 로컬에서 `eas credentials` (preview 프로필)로 만들어 둔다
name: Mobile (dev)

on:
  workflow_dispatch:

# 연달아 실행하면 앞 빌드를 기다리지 않고 마지막 develop 만 올린다
concurrency:
  group: mobile-dev
  cancel-in-progress: true

jobs:
  build:
    name: EAS build (preview)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # 플랫폼마다 배포 방식이 달라 나눠 부른다 (iOS 는 TestFlight 제출, Android 내부 배포 APK 는 제출 없음)
      - name: Build and submit iOS
        run: |
          echo "Building $(git rev-parse --short HEAD) from develop"
          eas build --platform ios --profile preview --non-interactive --no-wait \
            --auto-submit-with-profile preview

      - name: Build Android
        run: eas build --platform android --profile preview --non-interactive --no-wait
