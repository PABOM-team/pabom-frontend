# 개발 서버용 iOS 앱 "파봄(dev)"을 EAS에서 빌드해 TestFlight로 올린다 (eas.json preview 프로필).
# 운영 앱 "파봄"은 mobile-ios.yml 에서 main 기준으로만 배포한다.
# - 자동: develop 에 앱에 들어가는 코드(apps/mobile, packages/core, 의존성)가 바뀌어 들어오면 빌드·제출한다
# - 수동: Actions → "Mobile iOS (dev)" → Run workflow. 어떤 브랜치를 골라도 develop 최신 커밋을 빌드한다
name: Mobile iOS (dev)

on:
  push:
    branches: [develop]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-ios-dev.yml"
  workflow_dispatch:

# 연달아 머지되면 앞 빌드를 기다리지 않고 마지막 develop 만 올린다
concurrency:
  group: mobile-ios-dev
  cancel-in-progress: true

jobs:
  build:
    name: EAS iOS build (preview)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build and submit
        run: |
          echo "Building $(git rev-parse --short HEAD) from develop"
          eas build --platform ios --profile preview --non-interactive --no-wait \
            --auto-submit-with-profile preview
