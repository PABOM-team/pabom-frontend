# 운영 iOS 앱 "파봄"을 EAS에서 빌드·서명하고, 원하면 TestFlight로 올린다 (eas.json production 프로필).
# 서명 인증서·프로비저닝 프로파일은 EAS 서버에 있고(eas credentials), 여기서는 EXPO_TOKEN만 쓴다.
# 운영 배포는 항상 main 기준이다. 개발 앱 "파봄(dev)"은 mobile-ios-dev.yml 이 develop 에서 자동으로 올린다.
# - 수동 실행: Actions → "Mobile iOS" → Run workflow 에서 제출 여부를 고른다.
#   어떤 브랜치를 골라도 main 최신 커밋을 빌드한다
# - 태그: mobile-v* 태그를 올리면 production 빌드 후 TestFlight로 제출한다.
#   태그가 main에 들어간 커밋을 가리키지 않으면 빌드하지 않고 실패한다
name: Mobile iOS

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "빌드가 끝나면 TestFlight로 제출"
        type: boolean
        default: true
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS iOS build (production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      PROFILE: production
      SUBMIT: ${{ github.event_name == 'push' || inputs.submit }}
    steps:
      # 수동 실행은 고른 브랜치와 상관없이 main을, 태그는 그 태그 커밋을 받는다
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Ensure the commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) 는 main에 없는 커밋이다. main에 머지한 뒤 main 커밋에 태그를 붙인다"
            exit 1
          fi
          echo "Building $(git rev-parse --short HEAD) from main"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build (and submit)
        run: |
          args=(--platform ios --profile "$PROFILE" --non-interactive --no-wait)
          if [ "$SUBMIT" = "true" ]; then
            args+=(--auto-submit-with-profile "$PROFILE")
          fi
          eas build "${args[@]}"
